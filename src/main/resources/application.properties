# Application Server Port
server.port=${PORT:8080}

# Active Profile: Defaults to 'h2' so the application runs immediately without requiring a local MySQL server.
# To use MySQL, set SPRING_PROFILES_ACTIVE=mysql or run with: mvn spring-boot:run -Dspring-boot.run.profiles=mysql
spring.profiles.active=${SPRING_PROFILES_ACTIVE:h2}

# SpringDoc OpenAPI / Swagger UI Configuration
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.operationsSorter=method
springdoc.swagger-ui.tagsSorter=alpha
springdoc.swagger-ui.tryItOutEnabled=true
